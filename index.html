<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jared's Bookshelf</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Every book Jared Krouss has read since 2014, shelved by year.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500;0,6..96,700;1,6..96,500&family=Archivo+Narrow:wght@400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap">
<style>
/* Layout: a library wall. One wooden shelf per year read, newest on top; spines are clickable books. */
:root {
  --wall: #dde1d7;
  --recess: #c8cdc1;
  --ink: #1d221e;
  --muted: #5a645b;
  --line: #b6bcaf;
  --panel: #f4f5f0;
  --wood-top: #d8ab74;
  --wood: #b5844f;
  --wood-dark: #7a5430;
  --gold: #b0841f;
  --ribbon: #9e1f22;
  --focus: #1f5fbf;
  --f-display: "Bodoni Moda", "Didot", "Times New Roman", serif;
  --f-ui: "Archivo Narrow", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Newsreader", Georgia, "Times New Roman", serif;
  --row: 164px;
  --plank: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --wall: #131714; --recess: #0b0e0c; --ink: #e9e6da; --muted: #9ba293; --line: #2e3530;
    --panel: #1c211d; --wood-top: #7d5532; --wood: #5b3b21; --wood-dark: #2b1a0d;
    --gold: #d8b25c; --ribbon: #c4383a; --focus: #8ab4ff; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --wall: #131714; --recess: #0b0e0c; --ink: #e9e6da; --muted: #9ba293; --line: #2e3530;
  --panel: #1c211d; --wood-top: #7d5532; --wood: #5b3b21; --wood-dark: #2b1a0d;
  --gold: #d8b25c; --ribbon: #c4383a; --focus: #8ab4ff; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--wall); color: var(--ink); font-family: var(--f-ui);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.wrap { max-width: 1240px; margin: 0 auto; padding-block: 40px 64px; display: grid; gap: 28px; }

/* Header */
header { display: grid; gap: 14px; }
.eyebrow { font-size: 13px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
h1 { font-family: var(--f-display); font-weight: 500; font-size: clamp(40px, 7vw, 76px); line-height: .95; margin: 0; text-wrap: balance; letter-spacing: -.01em; }
h1 em { font-style: italic; }
.stats { display: flex; flex-wrap: wrap; gap: 8px 28px; font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
.stats b { color: var(--ink); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 22px; font-size: 14px; color: var(--muted); align-items: center; }
.legend span { display: inline-flex; gap: 8px; align-items: center; }
.sw { width: 12px; height: 26px; border-radius: 2px; background: #3b4a5c; position: relative; flex: none; }
.sw.fav::before, .sw.fav::after { content: ""; position: absolute; left: 0; right: 0; height: 2px; background: var(--gold); }
.sw.fav::before { top: 4px; } .sw.fav::after { bottom: 4px; }
.sw.life { background: #3b4a5c; }
.sw.life::after { content: ""; position: absolute; left: 3px; top: -3px; width: 5px; height: 14px; background: var(--ribbon); clip-path: polygon(0 0,100% 0,100% 100%,50% 78%,0 100%); }
.sw.re { display: grid; place-items: center; font-size: 9px; color: #fff; font-weight: 700; }

/* Toolbar */
.toolbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: color-mix(in srgb, var(--wall) 92%, transparent); backdrop-filter: blur(8px);
  display: flex; flex-wrap: wrap; gap: 10px; align-items: center; padding-block: 12px;
  border-bottom: 1px solid var(--line);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--wall); }
.search { flex: 1 1 240px; min-width: 0; position: relative; }
.search input {
  width: 100%; font: 500 16px var(--f-ui); color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px 10px 36px;
}
.search svg { position: absolute; left: 11px; top: 50%; translate: 0 -50%; width: 16px; height: 16px; stroke: var(--muted); fill: none; stroke-width: 2; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip, .btn, select {
  font: 600 14px var(--f-ui); color: var(--ink); background: transparent; border: 1px solid var(--line);
  border-radius: 999px; padding: 8px 14px; cursor: pointer; letter-spacing: .02em;
}
select { border-radius: 6px; background: var(--panel); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--wall); border-color: var(--ink); }
.btn { background: var(--wood); color: #fff8ec; border-color: var(--wood-dark); border-radius: 6px; }
.btn:hover { filter: brightness(1.08); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.count { font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; margin-left: auto; }

/* Shelves */
#library { display: grid; gap: 34px; }
.case { display: grid; gap: 0; }
.plaque { display: flex; align-items: baseline; gap: 12px; padding: 0 4px 8px; }
.plaque h2 { font-family: var(--f-display); font-weight: 500; font-size: 30px; margin: 0; font-variant-numeric: lining-nums; }
.plaque small { font-size: 14px; color: var(--muted); letter-spacing: .04em; }
.plaque .bar { flex: 1; height: 1px; background: var(--line); align-self: center; }
.shelf {
  display: flex; flex-wrap: wrap; align-items: flex-end; row-gap: var(--plank); column-gap: 0;
  padding: 0 10px var(--plank); border-radius: 3px;
  background:
    repeating-linear-gradient(to bottom,
      transparent 0 var(--row),
      var(--wood-top) var(--row) calc(var(--row) + 3px),
      var(--wood) calc(var(--row) + 3px) calc(var(--row) + var(--plank) - 2px),
      var(--wood-dark) calc(var(--row) + var(--plank) - 2px) calc(var(--row) + var(--plank))),
    linear-gradient(to bottom, color-mix(in srgb, var(--recess) 80%, #000 20%), var(--recess) 30px);
  background-size: 100% calc(var(--row) + var(--plank)), 100% calc(var(--row) + var(--plank));
  box-shadow: inset 8px 0 0 var(--wood), inset -8px 0 0 var(--wood);
}
.slot { height: var(--row); display: flex; align-items: flex-end; padding-top: 10px; }
.spine {
  --c: #3b4a5c; --t: #f3ead8; --h: 140px; --w: 28px;
  position: relative; width: var(--w); height: var(--h); border: 0; padding: 12px 0 10px; margin: 0 1px 0 0;
  background:
    linear-gradient(to right, rgb(0 0 0 / .28), rgb(255 255 255 / .10) 22%, rgb(255 255 255 / .02) 45%, rgb(0 0 0 / .08) 75%, rgb(0 0 0 / .32)),
    var(--c);
  color: var(--t); cursor: pointer; border-radius: 2px 2px 1px 1px;
  writing-mode: vertical-rl; display: flex; align-items: center; gap: 8px;
  font: 600 11px/1 var(--f-ui); letter-spacing: .06em; text-transform: uppercase;
  transition: translate .18s ease, box-shadow .18s ease;
  box-shadow: 0 1px 0 rgb(0 0 0 / .25);
}
.spine.lean { rotate: -4deg; transform-origin: bottom left; margin-left: 8px; }
.spine:hover, .spine:focus-visible { translate: 0 -10px; box-shadow: 0 10px 14px -8px rgb(0 0 0 / .5); z-index: 2; }
.spine .t { flex: 1 1 auto; min-height: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spine .a { flex: none; font-weight: 500; opacity: .8; font-size: 9.5px; max-height: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.spine.fic { font: italic 500 12.5px/1 var(--f-display); text-transform: none; letter-spacing: .01em; }
.spine.fic .a { font: 500 9.5px/1 var(--f-ui); text-transform: uppercase; letter-spacing: .06em; }
.spine.wide { font-size: 12.5px; }
.spine.wide.fic { font-size: 14px; }
.spine .band { position: absolute; left: 0; right: 0; height: 2px; background: rgb(255 255 255 / .22); }
.spine .band.b1 { top: 5px; } .spine .band.b2 { bottom: 5px; }
.spine.fav .band { background: var(--gold); height: 3px; box-shadow: 0 0 0 .5px rgb(0 0 0 / .2); }
.spine.fav .band.b1 { top: 4px; } .spine.fav .band.b2 { bottom: 4px; }
.spine .ribbon { position: absolute; top: -4px; left: 22%; width: 6px; height: 22px; background: var(--ribbon); clip-path: polygon(0 0,100% 0,100% 100%,50% 82%,0 100%); }
.spine .re { position: absolute; bottom: 12px; left: 50%; translate: -50% 0; writing-mode: horizontal-tb; font: 700 8px/1 var(--f-ui); background: var(--t); color: var(--c); border-radius: 6px; padding: 2px 3px; }
.spine.has-re { padding-bottom: 26px; }
/* Face-out books: real covers standing on the shelf */
.face {
  --c: #3b4a5c; --t: #f3ead8; --fh: 128px;
  position: relative; height: var(--fh); aspect-ratio: 2 / 3; margin: 0 7px; padding: 0; border: 0; cursor: pointer;
  border-radius: 1px 3px 3px 1px; overflow: hidden; background: var(--c); color: var(--t);
  box-shadow: 3px 4px 8px -2px rgb(0 0 0 / .45), inset 3px 0 0 rgb(0 0 0 / .18);
  transition: translate .18s ease, box-shadow .18s ease;
}
.face:hover, .face:focus-visible { translate: 0 -8px; box-shadow: 4px 14px 16px -8px rgb(0 0 0 / .55); z-index: 2; }
.face .gen { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: space-between; padding: 10px 8px 8px 11px; text-align: left; }
.face .gen b { font: 500 12px/1.12 var(--f-display); overflow: hidden; display: -webkit-box; -webkit-line-clamp: 6; -webkit-box-orient: vertical; overflow-wrap: anywhere; }
.face .gen i { font: 600 8px/1.2 var(--f-ui); font-style: normal; letter-spacing: .12em; text-transform: uppercase; opacity: .85; }
.face img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
.face::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to right, rgb(0 0 0 / .22), rgb(255 255 255 / .12) 4%, transparent 9%); pointer-events: none; }
.face .ribbon { position: absolute; top: -3px; right: 12%; width: 9px; height: 30px; z-index: 1; background: var(--ribbon); clip-path: polygon(0 0,100% 0,100% 100%,50% 82%,0 100%); }
.face.fav:not(.life) .ribbon { background: var(--gold); }
.face .re { position: absolute; bottom: 6px; right: 6px; z-index: 1; font: 700 9px/1 var(--f-ui); background: rgb(0 0 0 / .65); color: #fff; border-radius: 6px; padding: 3px 4px; }
.covers .face { --fh: 140px; margin: 0 5px; }
.bookend { width: 10px; height: 96px; margin: 0 8px 0 4px; background: linear-gradient(to right, var(--wood-top), var(--wood) 40%, var(--wood-dark)); border-radius: 2px 2px 0 0; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
.seg button { font: 600 14px var(--f-ui); color: var(--ink); background: var(--panel); border: 0; padding: 9px 14px; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--wall); }
.empty { padding: 40px 0; text-align: center; color: var(--muted); font-size: 16px; }
.empty button { margin-top: 12px; }

/* Book detail */
dialog {
  border: 0; padding: 0; border-radius: 10px; background: var(--panel); color: var(--ink);
  width: min(720px, calc(100vw - 32px)); max-height: calc(100dvh - 48px);
  box-shadow: 0 30px 80px -20px rgb(0 0 0 / .55);
}
dialog::backdrop { background: rgb(10 12 10 / .55); backdrop-filter: blur(3px); }
.book { display: grid; grid-template-columns: 200px 1fr; gap: 28px; padding: 28px; }
.jacket {
  --c: #3b4a5c; --t: #f3ead8; aspect-ratio: 2 / 3; max-width: 100%; border-radius: 3px 6px 6px 3px; overflow: hidden; position: relative;
  background: linear-gradient(to right, rgb(0 0 0 / .3), rgb(255 255 255 / .08) 6%, transparent 12%), var(--c); color: var(--t);
  display: flex; flex-direction: column; justify-content: space-between; padding: 22px 16px 18px 22px;
  box-shadow: 0 16px 30px -12px rgb(0 0 0 / .5);
}
.jacket .jt { font: 500 21px/1.1 var(--f-display); text-wrap: balance; overflow-wrap: anywhere; }
.jacket .ja { font: 600 11px/1.2 var(--f-ui); letter-spacing: .14em; text-transform: uppercase; opacity: .85; }
.jacket .rule { height: 1px; background: currentColor; opacity: .4; margin: 10px 0; }
.jacket img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .3s; }
.jacket img.ok { opacity: 1; }
.info { display: grid; gap: 14px; align-content: start; min-width: 0; }
.info h3 { font: 500 30px/1.08 var(--f-display); margin: 0; text-wrap: balance; }
.info .sub { font: italic 400 18px/1.35 var(--f-body); color: var(--muted); margin: -6px 0 0; text-wrap: pretty; }
.info .by { font: 400 18px var(--f-body); margin: 0; }
.info .by button { font: inherit; color: inherit; background: none; border: 0; padding: 0; border-bottom: 1px solid var(--line); cursor: pointer; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 18px; margin: 0; font-size: 14px; font-variant-numeric: tabular-nums; }
.facts dt { color: var(--muted); text-transform: uppercase; letter-spacing: .1em; font-size: 12px; padding-top: 2px; }
.facts dd { margin: 0; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; border-radius: 999px; padding: 4px 10px; border: 1px solid currentColor; }
.tag.fav { color: var(--gold); } .tag.life { color: var(--ribbon); } .tag.re { color: var(--muted); }
.more h4 { margin: 4px 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); }
.more ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.more li button { font: 400 15px/1.3 var(--f-body); color: var(--ink); background: none; border: 0; padding: 0; text-align: left; cursor: pointer; }
.more li button:hover { text-decoration: underline; }
.more li span { color: var(--muted); font: 13px var(--f-ui); margin-left: 6px; }
.links { display: flex; flex-wrap: wrap; gap: 14px; font-size: 14px; }
.links a { color: var(--ink); }
.close { position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; border-radius: 50%; border: 0; background: transparent; color: var(--muted); font-size: 22px; cursor: pointer; }
.close:hover { background: var(--line); }

@media (max-width: 620px) {
  :root { --row: 150px; }
  .wrap { padding-block: 24px 48px; }
  .book { grid-template-columns: 1fr; padding: 22px; gap: 20px; }
  .jacket { width: 150px; justify-self: center; }
  .info h3 { font-size: 25px; }
  .count { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { .spine { transition: none; } .jacket img { transition: none; } }
</style>

</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Krouss Library · Est. 2014</div>
    <h1>Jared's <em>Bookshelf</em></h1>
    <div class="stats" id="stats"></div>
    <div class="legend">
      <span><i class="sw life"></i>Life changing</span>
      <span><i class="sw fav"></i>Favorite</span>
      <span><i class="sw re">2×</i>Re-read</span>
    </div>
  </header>

  <div class="toolbar" role="search">
    <label class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
      <input id="q" type="search" placeholder="Search titles or authors" aria-label="Search titles or authors" autocomplete="off">
    </label>
    <div class="chips" id="chips">
      <button class="chip" data-f="F" aria-pressed="false" type="button">Fiction</button>
      <button class="chip" data-f="N" aria-pressed="false" type="button">Nonfiction</button>
      <button class="chip" data-f="fav" aria-pressed="false" type="button">Favorites</button>
      <button class="chip" data-f="life" aria-pressed="false" type="button">Life changing</button>
    </div>
    <div class="seg" id="mode" role="group" aria-label="Show books as">
      <button type="button" data-m="covers" aria-pressed="true">Covers</button>
      <button type="button" data-m="spines" aria-pressed="false">Spines</button>
    </div>
    <select id="group" aria-label="Arrange shelves by">
      <option value="year">Shelve by year</option>
      <option value="author">Shelve by author</option>
      <option value="title">Shelve by title</option>
    </select>
    <button class="btn" id="random" type="button">Pull a random book</button>
    <span class="count" id="count"></span>
  </div>

  <main id="library" aria-live="polite"></main>
</div>

<dialog id="detail" aria-labelledby="d-title"></dialog>

Zadie Smith",2017,"F",""],["Who is Michael Ovitz?","Michael Ovitz",2018,"N",""],["Who Knew","Barry Diller",2025,"N",""],["Why Not the Best?: The First Fifty Years","Jimmy Carter",2025,"N",""],["Why We Sleep: Unlocking the Power of Sleep and Dreams","Matthew Walker",2018,"N",""],["Wild Bill Donovan","Douglas Waller",2025,"N",""],["Win Every Argument: The Art of Debating, Persuading, and Public Speaking","Mehdi Hassan",2023,"N",""],["Working","Robert Caro",2019,"N","F"],["Working Backwards: Insights, Stories, and Secrets from Inside Amazon","Colin Bryar, Bill Carr",2021,"N",""],["Writing for Busy Readers: Communicate More Effectively in the Real World","Todd Rogers, Jessica Lasky-Fink",2023,"N",""],["Zodiac","Robert Graysmith",2026,"N",""]]</script>
<script>
(() => {
  const SHEET_ID = "1EcfuNdzY2i5wm-A5EJX2JzTOrFweOu60p0o1zfDDSAY";
  const LIVE_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=Bookshelf&range=B5:F&headers=0`;
  const SNAPSHOT_DATE = "Oct 20, 2026";
  // Cloth binding colors: [cloth, lettering]
  const CLOTHS = [
    ["#7b2226", "#f1dfc0"], ["#1f3a5f", "#efe4cc"], ["#2f4b3a", "#efe2c4"], ["#c49a3a", "#2a1e10"],
    ["#4a3b5c", "#eee1cf"], ["#8a5a2b", "#f6e8cf"], ["#2b2d30", "#e9d6a6"], ["#1d5c63", "#f1e6cf"],
    ["#a8452f", "#f8ead4"], ["#5d6b4a", "#f3ead2"], ["#d8cdb4", "#2b2620"], ["#3c4f7a", "#f1e7d1"],
    ["#6e2f4f", "#f3e2cf"], ["#9a8f78", "#1f1c16"], ["#14332c", "#d9c48c"], ["#b7562a", "#1d140c"]
  ];

  const $ = s => document.querySelector(s);
  const hash = s => { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const norm = s => s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, " ").trim();
  const lastName = a => { const first = a.split(",")[0].trim(); const p = first.split(/\s+/); return p[p.length - 1] || first; };

  let books = [];
  const state = { q: "", f: new Set(), group: "year", mode: "covers" };
  try { state.group = localStorage.getItem("shelf-group") || state.group; state.mode = localStorage.getItem("shelf-view") || state.mode; } catch (e) {}
  $("#group").value = state.group;
  const setModeButtons = () => document.querySelectorAll("#mode button").forEach(x => x.setAttribute("aria-pressed", String(x.dataset.m === state.mode)));
  setModeButtons();

  // Covers. covers.json is written nightly by the GitHub Action; anything it hasn't seen yet
  // is looked up in the browser and remembered in localStorage.
  // Entry shape: { src, color?, ink? }, or { none: <timestamp> } when no cover was found.
  const COVERS = {};
  const coverKey = b => b.key + "|" + norm(b.author.split(",")[0]);
  try { Object.assign(COVERS, JSON.parse(localStorage.getItem("shelf-covers") || "{}")); } catch (e) {}
  let saveTimer;
  const saveCovers = () => { clearTimeout(saveTimer); saveTimer = setTimeout(() => { try { localStorage.setItem("shelf-covers", JSON.stringify(COVERS)); } catch (e) {} }, 800); };
  const inkFor = hex => { const n = parseInt(hex.slice(1), 16); const l = (0.2126 * (n >> 16) + 0.7152 * (n >> 8 & 255) + 0.0722 * (n & 255)) / 255; return l > 0.6 ? "#1f1a14" : "#f6efe2"; };
  function applyCover(b) {
    const c = COVERS[b.ckey];
    b.cover = c && c.src ? c.src : null;
    if (c && c.color) b.cloth = [c.color, c.ink || inkFor(c.color)];
  }

  function build(rows) {
    const snapTags = new Map(SNAP.map(r => [norm(r[0]) + "|" + r[2], r[4]]));
    const list = rows.filter(r => r[0]).map((r, i) => {
      const [title, author, year, type, tagRaw] = r;
      let tag = /life/i.test(tagRaw || "") ? "L" : /fav/i.test(tagRaw || "") ? "F" : (tagRaw === "L" || tagRaw === "F" ? tagRaw : "");
      if (!tag) tag = snapTags.get(norm(title) + "|" + year) || "";
      const [main, ...rest] = title.split(/:\s+/);
      return { id: i, title, main: main.trim(), sub: rest.join(": ").trim(), author: author || "Unknown", year: year || null, type: /^f/i.test(type || "") ? "F" : "N", fav: tag === "F" || tag === "L", life: tag === "L", key: norm(title) };
    });
    const reads = {};
    list.forEach(b => { (reads[b.key] = reads[b.key] || []).push(b); });
    list.forEach(b => {
      const all = reads[b.key].slice().sort((a, c) => (a.year || 0) - (c.year || 0));
      b.readCount = all.length; b.readNo = all.indexOf(b) + 1; b.allYears = all.map(x => x.year);
      const h = hash(b.title + b.author);
      b.cloth = CLOTHS[h % CLOTHS.length];
      const len = b.main.length;
      b.w = Math.max(22, Math.min(46, 20 + Math.round(len / 3.2) + (h >> 5) % 9));
      b.h = 108 + (h >> 9) % 40;
      b.bands = (h >> 13) % 3;
      b.lean = (h >> 17) % 41 === 0;
      b.ckey = coverKey(b);
      applyCover(b);
    });
    return list;
  }

  function parseCSV(text) {
    const rows = []; let row = [], cell = "", q = false;
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) { if (c === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; } else cell += c; }
      else if (c === '"') q = true;
      else if (c === ",") { row.push(cell); cell = ""; }
      else if (c === "\n" || c === "\r") { if (c === "\r" && text[i + 1] === "\n") i++; row.push(cell); rows.push(row); row = []; cell = ""; }
      else cell += c;
    }
    if (cell || row.length) { row.push(cell); rows.push(row); }
    return rows;
  }

  function matches(b) {
    if (state.f.has("F") !== state.f.has("N")) { if (state.f.has("F") && b.type !== "F") return false; if (state.f.has("N") && b.type !== "N") return false; }
    if (state.f.has("fav") && !state.f.has("life") && !b.fav) return false;
    if (state.f.has("life") && !state.f.has("fav") && !b.life) return false;
    if (state.f.has("life") && state.f.has("fav") && !b.fav) return false;
    if (state.q) { const q = norm(state.q); if (!norm(b.title + " " + b.author).includes(q)) return false; }
    return true;
  }

  function spine(b) {
    const cls = ["spine", b.type === "F" ? "fic" : "", b.fav ? "fav" : "", b.w >= 36 ? "wide" : "", b.lean ? "lean" : "", b.readNo > 1 ? "has-re" : ""].join(" ");
    const bands = b.fav ? '<i class="band b1"></i><i class="band b2"></i>' : (b.bands > 0 ? '<i class="band b1"></i>' : "") + (b.bands > 1 ? '<i class="band b2"></i>' : "");
    return `<div class="slot"><button type="button" class="${cls}" data-id="${b.id}" style="--c:${b.cloth[0]};--t:${b.cloth[1]};--w:${b.w}px;--h:${b.h}px" aria-label="${esc(b.title)} by ${esc(b.author)}, read ${b.year || "undated"}" title="${esc(b.main)} — ${esc(b.author)}">${bands}${b.life ? '<i class="ribbon"></i>' : ""}<span class="t">${esc(b.main)}</span><span class="a">${esc(lastName(b.author))}</span>${b.readNo > 1 ? `<i class="re">${b.readNo}×</i>` : ""}</button></div>`;
  }

  function face(b) {
    const cls = ["face", b.fav ? "fav" : "", b.life ? "life" : ""].join(" ");
    return `<div class="slot"><button type="button" class="${cls}" data-id="${b.id}" style="--c:${b.cloth[0]};--t:${b.cloth[1]}" aria-label="${esc(b.title)} by ${esc(b.author)}, read ${b.year || "undated"}" title="${esc(b.main)} — ${esc(b.author)}"><span class="gen"><b>${esc(b.main)}</b><i>${esc(lastName(b.author))}</i></span>${b.cover ? `<img src="${esc(b.cover)}" alt="" loading="lazy" decoding="async" onerror="this.remove()">` : ""}${b.fav ? '<i class="ribbon"></i>' : ""}${b.readNo > 1 ? `<i class="re">${b.readNo}×</i>` : ""}</button></div>`;
  }

  // Spines view: favorites stand face-out at the start of each shelf, then a bookend, then the spines.
  function shelfHTML(list) {
    if (state.mode === "covers") return list.map(face).join("");
    const out = list.filter(b => b.fav), rest = list.filter(b => !b.fav);
    return out.map(face).join("") + (out.length && rest.length ? '<div class="slot"><i class="bookend"></i></div>' : "") + rest.map(spine).join("");
  }

  function render() {
    const shown = books.filter(matches);
    const groups = new Map();
    let sorted;
    if (state.group === "year") {
      sorted = shown.slice().sort((a, b) => (b.year || 0) - (a.year || 0) || a.title.localeCompare(b.title));
      sorted.forEach(b => { const k = b.year || "Undated"; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(b); });
    } else {
      const keyOf = b => state.group === "author" ? lastName(b.author) : b.title.replace(/^(the|a|an)\s+/i, "");
      sorted = shown.slice().sort((a, b) => keyOf(a).localeCompare(keyOf(b)) || (a.year || 0) - (b.year || 0));
      sorted.forEach(b => { let k = norm(keyOf(b)).charAt(0).toUpperCase(); if (!/[A-Z]/.test(k)) k = "#"; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(b); });
    }
    const thisYear = new Date().getFullYear();
    let html = "";
    for (const [k, list] of groups) {
      const note = state.group === "year" && k === thisYear ? " · in progress" : "";
      html += `<section class="case"><div class="plaque"><h2>${esc(k)}</h2><small>${list.length} ${list.length === 1 ? "book" : "books"}${note}</small><i class="bar"></i></div><div class="shelf${state.mode === "covers" ? " covers" : ""}">${shelfHTML(list)}</div></section>`;
    }
    $("#library").innerHTML = html || `<div class="empty">No books on the shelf match that.<br><button class="chip" type="button" id="reset">Clear search and filters</button></div>`;
    $("#count").textContent = shown.length === books.length ? `${books.length} books` : `${shown.length} of ${books.length} books`;
    observeShelves();
  }

  // Look up covers for books as their shelf scrolls into view
  const MONTH = 30 * 864e5;
  const queue = []; const queued = new Set(); let active = 0;
  const io = "IntersectionObserver" in window ? new IntersectionObserver(entries => {
    entries.forEach(en => {
      if (!en.isIntersecting) return;
      io.unobserve(en.target);
      en.target.querySelectorAll("[data-id]").forEach(el => {
        const b = books[+el.dataset.id]; if (!b) return;
        const c = COVERS[b.ckey];
        if (c && (c.src ? c.color !== undefined : Date.now() - c.none < MONTH)) return;
        if (queued.has(b.ckey)) return;
        queued.add(b.ckey); queue.push(b);
      });
      pump();
    });
  }, { rootMargin: "400px 0px" }) : null;
  function observeShelves() { if (io) document.querySelectorAll(".shelf").forEach(s => io.observe(s)); }
  function pump() {
    while (active < 3 && queue.length) {
      const b = queue.shift(); active++;
      resolveCover(b).catch(() => {}).finally(() => { active--; pump(); });
    }
  }
  async function resolveCover(b) {
    let entry = COVERS[b.ckey];
    if (!entry || !entry.src) {
      const author = b.author.split(",")[0];
      let src = null;
      const r = await fetch(`https://openlibrary.org/search.json?title=${encodeURIComponent(b.main)}&author=${encodeURIComponent(author)}&limit=3&fields=cover_i`);
      if (r.ok) { const d = (await r.json()).docs?.find(x => x.cover_i); if (d) src = `https://covers.openlibrary.org/b/id/${d.cover_i}-M.jpg`; }
      if (!src) {
        const g = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(`intitle:${b.main} inauthor:${author}`)}&maxResults=3&fields=items(volumeInfo/imageLinks)`);
        if (g.ok) { const it = (await g.json()).items?.find(x => x.volumeInfo?.imageLinks?.thumbnail); if (it) src = it.volumeInfo.imageLinks.thumbnail.replace(/^http:/, "https:").replace("&edge=curl", ""); }
      }
      entry = src ? { src } : { none: Date.now() };
    }
    if (entry.src && entry.color === undefined) entry.color = await sampleColor(entry.src);
    COVERS[b.ckey] = entry; saveCovers();
    books.filter(x => x.ckey === b.ckey).forEach(x => { applyCover(x); patch(x); });
  }
  // The spine takes its color from the left edge of the real cover
  function sampleColor(src) {
    return new Promise(res => {
      const img = new Image(); img.crossOrigin = "anonymous";
      img.onload = () => {
        try {
          const c = document.createElement("canvas"); c.width = 8; c.height = 40;
          const x = c.getContext("2d", { willReadFrequently: true });
          x.drawImage(img, 0, 0, Math.max(2, img.naturalWidth * 0.08), img.naturalHeight, 0, 0, 8, 40);
          const d = x.getImageData(0, 0, 8, 40).data; let r = 0, g = 0, bl = 0, n = 0;
          for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; bl += d[i + 2]; n++; }
          if (img.naturalWidth < 10) return res(null);
          res("#" + [r, g, bl].map(v => Math.round(v / n).toString(16).padStart(2, "0")).join(""));
        } catch (e) { res(null); }
      };
      img.onerror = () => res(null);
      img.src = src;
    });
  }
  function patch(b) {
    document.querySelectorAll(`[data-id="${b.id}"]`).forEach(el => {
      el.style.setProperty("--c", b.cloth[0]); el.style.setProperty("--t", b.cloth[1]);
      if (el.classList.contains("face") && b.cover && !el.querySelector("img")) {
        const img = document.createElement("img"); img.alt = ""; img.decoding = "async"; img.onerror = () => img.remove(); img.src = b.cover;
        el.querySelector(".gen").after(img);
      }
    });
  }

  function renderStats(live) {
    const years = {}; const authors = {};
    books.forEach(b => { if (b.year) years[b.year] = (years[b.year] || 0) + 1; b.author.split(",").forEach(a => { a = a.trim(); if (a) authors[a] = (authors[a] || 0) + 1; }); });
    const ys = Object.keys(years).map(Number).sort();
    const best = ys.reduce((m, y) => years[y] > (years[m] || 0) ? y : m, ys[0]);
    const topA = Object.entries(authors).sort((a, b) => b[1] - a[1])[0];
    const fic = books.filter(b => b.type === "F").length;
    $("#stats").innerHTML = `<span><b>${books.length}</b> books read</span><span><b>${ys.length}</b> years on the shelf</span><span>Biggest year <b>${best}</b> (${years[best]})</span><span>Most read <b>${esc(topA[0])}</b> (${topA[1]})</span><span><b>${Math.round(fic / books.length * 100)}%</b> fiction</span>`;
    document.documentElement.dataset.source = live ? "live" : "snapshot";
  }

  // Book detail
  const dlg = $("#detail");
  let coverReq = 0;
  function open(id) {
    const b = books[id]; if (!b) return;
    const others = books.filter(x => x.author === b.author && x.key !== b.key).filter((x, i, a) => a.findIndex(y => y.key === x.key) === i);
    const tags = [b.life ? '<span class="tag life">Life changing</span>' : "", b.fav && !b.life ? '<span class="tag fav">Favorite</span>' : "", b.readCount > 1 ? `<span class="tag re">Read ${b.readCount} times</span>` : ""].join("");
    const q = encodeURIComponent(b.main + " " + b.author.split(",")[0]);
    dlg.innerHTML = `<button class="close" type="button" aria-label="Close" data-close>×</button>
      <div class="book">
        <div class="jacket" style="--c:${b.cloth[0]};--t:${b.cloth[1]}"><div><div class="jt">${esc(b.main)}</div><div class="rule"></div></div><div class="ja">${esc(b.author)}</div><img alt="" id="cover"></div>
        <div class="info">
          <h3 id="d-title">${esc(b.main)}</h3>
          ${b.sub ? `<p class="sub">${esc(b.sub)}</p>` : ""}
          <p class="by">by <button type="button" data-author="${esc(b.author)}">${esc(b.author)}</button></p>
          ${tags ? `<div class="tags">${tags}</div>` : ""}
          <dl class="facts">
            <dt>Read</dt><dd>${b.allYears.map(y => y || "Undated").join(", ")}</dd>
            <dt>Shelf</dt><dd>${b.type === "F" ? "Fiction" : "Nonfiction"}</dd>
            <dt id="pub-dt" hidden>Published</dt><dd id="pub-dd" hidden></dd>
          </dl>
          ${others.length ? `<div class="more"><h4>Also on the shelf by ${esc(lastName(b.author))}</h4><ul>${others.map(o => `<li><button type="button" data-open="${o.id}">${esc(o.main)}</button><span>${o.year || ""}</span></li>`).join("")}</ul></div>` : ""}
          <div class="links"><a href="https://openlibrary.org/search?q=${q}" target="_blank" rel="noopener">Open Library</a><a href="https://www.goodreads.com/search?q=${q}" target="_blank" rel="noopener">Goodreads</a><a href="https://bookshop.org/search?keywords=${q}" target="_blank" rel="noopener">Bookshop.org</a></div>
        </div>
      </div>`;
    if (!dlg.open) dlg.showModal();
    loadCover(b, ++coverReq);
  }
  function showJacket(src) {
    const img = $("#cover"); if (!img) return;
    img.onload = () => img.naturalWidth > 10 && img.classList.add("ok");
    img.src = src.replace(/-M\.jpg$/, "-L.jpg");
  }
  async function loadCover(b, req) {
    if (b.cover) showJacket(b.cover);
    try {
      const url = `https://openlibrary.org/search.json?title=${encodeURIComponent(b.main)}&author=${encodeURIComponent(b.author.split(",")[0])}&limit=1&fields=cover_i,first_publish_year,number_of_pages_median`;
      const r = await fetch(url); if (!r.ok) return;
      const d = (await r.json()).docs?.[0]; if (!d || req !== coverReq) return;
      if (d.first_publish_year) {
        $("#pub-dd").textContent = d.first_publish_year + (d.number_of_pages_median ? ` · ${d.number_of_pages_median} pages` : "");
        $("#pub-dt").hidden = false; $("#pub-dd").hidden = false;
      }
      if (d.cover_i && !b.cover) showJacket(`https://covers.openlibrary.org/b/id/${d.cover_i}-L.jpg`);
    } catch (e) { /* the typeset jacket stays */ }
  }
  dlg.addEventListener("click", e => {
    if (e.target === dlg || e.target.closest("[data-close]")) return dlg.close();
    const o = e.target.closest("[data-open]"); if (o) return open(+o.dataset.open);
    const a = e.target.closest("[data-author]");
    if (a) { dlg.close(); state.q = a.dataset.author.split(",")[0]; $("#q").value = state.q; render(); window.scrollTo({ top: 0 }); }
  });

  // Controls
  $("#library").addEventListener("click", e => {
    const s = e.target.closest(".spine, .face"); if (s) return open(+s.dataset.id);
    if (e.target.closest("#reset")) { state.q = ""; $("#q").value = ""; state.f.clear(); document.querySelectorAll(".chip[data-f]").forEach(c => c.setAttribute("aria-pressed", "false")); render(); }
  });
  $("#q").addEventListener("input", e => { state.q = e.target.value.trim(); render(); });
  $("#chips").addEventListener("click", e => {
    const c = e.target.closest(".chip"); if (!c) return;
    const f = c.dataset.f; const on = !state.f.has(f);
    on ? state.f.add(f) : state.f.delete(f); c.setAttribute("aria-pressed", String(on)); render();
  });
  $("#mode").addEventListener("click", e => {
    const m = e.target.closest("button"); if (!m || m.dataset.m === state.mode) return;
    state.mode = m.dataset.m; setModeButtons(); try { localStorage.setItem("shelf-view", state.mode); } catch (err) {} render();
  });
  $("#group").addEventListener("change", e => { state.group = e.target.value; try { localStorage.setItem("shelf-group", state.group); } catch (err) {} render(); });
  $("#random").addEventListener("click", () => {
    const pool = books.filter(matches); if (!pool.length) return;
    const b = pool[Math.floor(Math.random() * pool.length)];
    const el = document.querySelector(`.spine[data-id="${b.id}"], .face[data-id="${b.id}"]`);
    if (el) { el.scrollIntoView({ block: "center", behavior: matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth" }); el.focus({ preventScroll: true }); setTimeout(() => open(b.id), 450); }
    else open(b.id);
  });

  // Data: show the saved copy instantly, then swap in the live sheet if it loads
  const SNAP = JSON.parse($("#snapshot").textContent);
  books = build(SNAP); renderStats(false); render();
  fetch("covers.json", { cache: "no-cache" }).then(r => r.ok ? r.json() : null).then(saved => {
    if (!saved) return;
    for (const [k, v] of Object.entries(saved)) if (v && (v.src || !COVERS[k] || !COVERS[k].src)) COVERS[k] = v;
    books.forEach(b => { applyCover(b); patch(b); });
  }).catch(() => {});
  fetch(LIVE_URL, { cache: "no-store" }).then(r => r.ok ? r.text() : Promise.reject(r.status)).then(text => {
    const rows = parseCSV(text).map(r => [(r[0] || "").trim(), (r[1] || "").trim(), parseInt(r[2], 10) || null, (r[3] || "").trim(), (r[4] || "").trim()]).filter(r => r[0] && r[0] !== "Title");
    if (rows.length < 10) return;
    books = build(rows); renderStats(true); render();
  }).catch(() => {});
})();
</script>

</body>
</html>
