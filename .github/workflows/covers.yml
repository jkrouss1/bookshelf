name: Update book covers

on:
  schedule:
    - cron: "17 9 * * *" # daily
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: [scripts/build_covers.py]

permissions:
  contents: write

concurrency:
  group: covers
  cancel-in-progress: true

jobs:
  covers:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests pillow
      - run: python scripts/build_covers.py
      - name: Commit covers.json if it changed
        run: |
          git config user.name "bookshelf-bot"
          git config user.email "bookshelf-bot@users.noreply.github.com"
          git add covers.json
          git diff --cached --quiet || (git commit -m "Update book covers" && git pull --rebase origin main && git push)
